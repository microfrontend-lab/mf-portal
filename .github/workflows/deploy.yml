name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY_URL: https://storage.googleapis.com/mf-registry/registry.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm stylelint
      - run: pnpm test

      - run: pnpm build

      # Workload Identity Federation auth also drives the Firebase CLI here:
      # google-github-actions/auth exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools picks up for non-interactive deploys — no
      # separate `firebase login:ci` token needed. The deploying identity
      # needs roles/firebasehosting.admin (granted to gh-actions-deploy@
      # alongside its existing storage.objectAdmin role).
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: pnpm exec firebase deploy --only hosting --project module-federation-lab --non-interactive
